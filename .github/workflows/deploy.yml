name: Deploy Laravel Backend to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        env:
          EC2_USER: root
          EC2_HOST: 217.216.110.171
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > private_key.pem
          chmod 600 private_key.pem
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -i private_key.pem $EC2_USER@$EC2_HOST << 'EOF'
            cd /var/www/money-manager-web-backend
            chown -R openclaw:openclaw /var/www/money-manager-web-backend
            sudo -u openclaw -- sh -lc '
              cd /var/www/money-manager-web-backend &&
              git fetch origin &&
              git reset --hard origin/main &&
              composer install --no-dev --optimize-autoloader &&
              php artisan migrate --force &&
              php artisan cache:clear &&
              php artisan config:clear &&
              php artisan route:clear &&
              php artisan view:clear &&
              /home/openclaw/.npm-global/bin/pm2 restart piggybang-backend &&
              /home/openclaw/.npm-global/bin/pm2 save
            '
            systemctl reload nginx
          EOF
